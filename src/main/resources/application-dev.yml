# Profile de desenvolvimento local. Ativar com --spring.profiles.active=dev
# (ou SPRING_PROFILES_ACTIVE=dev).
#
# Aponta por padrão para um Postgres local (ex.: o que já está instalado
# neste ambiente de validação, ou um container Docker/Testcontainers
# manual) — nunca para o Supabase de produção. Para desenvolver contra uma
# cópia dos dados reais, sobrescreva DB_URL/DB_USER/DB_PASSWORD via
# variável de ambiente ou --spring.datasource.* na linha de comando.
spring:
  # Segredos de Storage/Turnstile em dev: arquivo na RAIZ do repo,
  # gitignorado. Sem isto, $env:SUPABASE_* só vale no terminal onde foi
  # setado — o mvn em outro terminal sobe com storage vazio (503).
  config:
    import: optional:file:./application-dev-local.yml
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/servirea_dev}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:}

management:
  endpoint:
    health:
      show-details: always

# Segredo de JWT SÓ para desenvolvimento local — nunca usar em produção
# (application-prod.yml exige JWT_SECRET via variável de ambiente, sem
# valor padrão). Gerado uma vez para este projeto, não é sensível fora de
# um ambiente de dev descartável.
servire:
  security:
    jwt:
      secret: grvXECHecIkvKki3iJaO/Usa1NVGCk9Hz7xGsk8EutY=
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  frontend:
    base-url: ${FRONTEND_BASE_URL:http://localhost:4200}
  # Storage em dev: NÃO definir base-url/service-role-key aqui.
  # ${SUPABASE_*:} vazio sobrescreve application-dev-local.yml e o
  # Supabase responde Invalid Compact JWS. Keys ficam no arquivo
  # gitignorado importado acima, ou em SERVIRE_STORAGE_BASE_URL /
  # SERVIRE_STORAGE_SERVICE_ROLE_KEY (binding padrão do Spring).
  turnstile:
    secret-key: ${TURNSTILE_SECRET_KEY:}
  # E-mail em dev: NÃO definir provider/api-key aqui. ${EMAIL_PROVIDER:log}
  # e ${RESEND_API_KEY:} vazios sobrescrevem application-dev-local.yml e
  # o bean continua sendo LoggingEmailSender (stub). Em local: provider
  # resend + api-key. Sem o arquivo, o default do record/Logging
  # (matchIfMissing) mantém o stub.

logging:
  level:
    br.com.servire: DEBUG
