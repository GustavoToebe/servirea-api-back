# Profile de produção (VPS, seção 1.2/11 do plano mestre). Todas as
# credenciais vêm de variáveis de ambiente — nunca hardcoded aqui nem em
# nenhum arquivo versionado (seção 90: "nunca versionar .env com segredo").
#
# DB_URL deve apontar para o Postgres do Supabase, incluindo sslmode=require,
# ex.: jdbc:postgresql://db.<ref>.supabase.co:5432/postgres?sslmode=require
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

management:
  endpoint:
    health:
      show-details: never

# JWT_SECRET obrigatório via variável de ambiente (seção 90) — sem valor
# padrão de propósito, para o Spring falhar rápido na subida se o segredo
# não foi configurado, em vez de a aplicação subir "funcionando" com um
# segredo previsível.
servire:
  security:
    jwt:
      secret: ${JWT_SECRET}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS}
  frontend:
    base-url: ${FRONTEND_BASE_URL}
  # SUPABASE_URL/SUPABASE_SERVICE_ROLE_KEY/TURNSTILE_SECRET_KEY obrigatórios
  # via variável de ambiente (seção 90) — sem valor padrão, mesma regra de
  # JWT_SECRET/DB_URL acima.
  storage:
    base-url: ${SUPABASE_URL}
    service-role-key: ${SUPABASE_SERVICE_ROLE_KEY}
  turnstile:
    secret-key: ${TURNSTILE_SECRET_KEY}
  # E-mail (Fase 11, seção 32/58) — Resend por padrão em produção;
  # RESEND_API_KEY é obrigatório (sem valor padrão, mesma regra de
  # JWT_SECRET/DB_URL acima) quando provider=resend. "provider" em si
  # aceita override via EMAIL_PROVIDER (ex.: voltar para "log" temporariamente
  # numa indisponibilidade do Resend) — não é segredo, só um interruptor de
  # comportamento, por isso tem valor padrão mesmo aqui. Mesmo raciocínio
  # para "from": não é segredo (é o próprio remetente visível ao
  # destinatário), então tem valor padrão aqui — decidido com o usuário em
  # 22/09/2026 como contato@servirea.com.br (troca do domínio de teste
  # onboarding@resend.dev, seção 122 item 16). Domínio servirea.com.br
  # "Verified" no Resend e envio real confirmado em 23/09/2026 (SPF, DKIM
  # e DMARC em PASS no Gmail — ver "Próximos passos" no README.md).
  email:
    provider: ${EMAIL_PROVIDER:resend}
    resend:
      api-key: ${RESEND_API_KEY}
      from: ${RESEND_FROM:contato@servirea.com.br}

logging:
  level:
    root: INFO
