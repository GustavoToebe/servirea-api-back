# Profile de produção (VPS, seção 1.2/11 do plano mestre). Todas as
# credenciais vêm de variáveis de ambiente — nunca hardcoded aqui nem em
# nenhum arquivo versionado (seção 90: "nunca versionar .env com segredo").
#
# DB_URL deve apontar para o Postgres do Supabase, incluindo sslmode=require,
# ex.: jdbc:postgresql://db.<ref>.supabase.co:5432/postgres?sslmode=require
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

management:
  endpoint:
    health:
      show-details: never

# JWT_SECRET obrigatório via variável de ambiente (seção 90) — sem valor
# padrão de propósito, para o Spring falhar rápido na subida se o segredo
# não foi configurado, em vez de a aplicação subir "funcionando" com um
# segredo previsível.
servire:
  security:
    jwt:
      secret: ${JWT_SECRET}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS}
  frontend:
    base-url: ${FRONTEND_BASE_URL}
  # SUPABASE_URL/SUPABASE_SERVICE_ROLE_KEY/TURNSTILE_SECRET_KEY obrigatórios
  # via variável de ambiente (seção 90) — sem valor padrão, mesma regra de
  # JWT_SECRET/DB_URL acima.
  storage:
    base-url: ${SUPABASE_URL}
    service-role-key: ${SUPABASE_SERVICE_ROLE_KEY}
  turnstile:
    secret-key: ${TURNSTILE_SECRET_KEY}

logging:
  level:
    root: INFO
