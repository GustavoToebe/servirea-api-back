spring:
  application:
    name: servire-api

  # Virtual Threads (seção 15/68 do plano mestre) — a aplicação continua
  # síncrona (não há justificativa para WebFlux), só o pool de threads do
  # Tomcat passa a usar Virtual Threads.
  threads:
    virtual:
      enabled: true

  jpa:
    # O Flyway é o dono do schema (migrations em db/migration). O Hibernate
    # nunca cria/altera tabela sozinho — só valida que as entidades batem
    # com o schema já migrado. Ver seção 8 do plano mestre ("Proibido
    # alterar produção manualmente e deixar a alteração fora do repositório").
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: false

  # Upload de foto (Fase 7, seção 107) — o padrão do Spring Boot é 1 MB,
  # bem abaixo do limite de 5 MB do bucket "voluntarios-fotos" (V015);
  # 6 MB dá margem para o multipart/form-data em torno do arquivo em si.
  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 6MB

# Autenticação própria (Fase 5, seção 32/105). "jwt.secret" propositalmente
# NÃO tem valor padrão aqui — só em application-dev.yml/application-test.yml
# (segredo fixo, só para desenvolvimento/teste) e via variável de ambiente
# JWT_SECRET em produção (application-prod.yml, sem valor padrão, mesma
# regra já usada para DB_URL/DB_USER/DB_PASSWORD — seção 90).
servire:
  security:
    jwt:
      access-token-ttl: PT15M
      tenant-selection-token-ttl: PT5M
    refresh-token-ttl: P30D
    password-reset-token-ttl: PT1H
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  # URL do Angular, usada só para montar o link de "esqueci minha senha"
  # (seção 32). Domínio oficial (servirea.com.br, seção 131.8) ainda não
  # registrado — valor de dev/test em application-dev.yml/application-test.yml;
  # em produção vem de FRONTEND_BASE_URL sem valor padrão (application-prod.yml,
  # mesma regra de DB_URL/JWT_SECRET, seção 90).

  # Storage (Fase 7, seção 107). base-url/service-role-key propositalmente
  # SEM entrada aqui — mesma regra de JWT_SECRET/DB_URL (seção 90): nunca
  # versionar segredo/endpoint de produção. application-dev.yml/
  # application-test.yml dão um valor de desenvolvimento (upload real
  # nesses ambientes falha alto e cedo via
  # SupabaseStorageService.requireConfigurado, nunca silenciosamente);
  # application-prod.yml exige SUPABASE_URL/SUPABASE_SERVICE_ROLE_KEY sem
  # valor padrão (falha a subida se ausente).
  storage:
    bucket: voluntarios-fotos
    signed-url-ttl: PT1H
    max-file-size-bytes: 5242880
    allowed-mime-types: image/jpeg,image/png,image/webp,image/heic

  # Turnstile (Fase 8, seção 44) — anti-robô no formulário público de
  # inscrição. secret-key também sem entrada aqui, mesma regra acima — o
  # TurnstileService falha fechado (recusa a inscrição) se estiver vazio,
  # nunca deixa passar sem validar.

  # Provedor de e-mail (Fase 11, seção 32/58 — Resend, decidido com o
  # usuário em 22/09/2026). "provider" (log|resend) SEM entrada aqui de
  # propósito — dev/test travam em "log" (LoggingEmailSender, nunca dispara
  # e-mail de verdade sem uma troca explícita de configuração);
  # application-prod.yml troca para "resend" (ResendEmailSender). "api-key"
  # também sem entrada aqui, mesma regra de JWT_SECRET/DB_URL (seção 90) —
  # só via RESEND_API_KEY. "from" tem valor padrão em ResendProperties
  # (onboarding@resend.dev, domínio de teste do Resend) só para os
  # profiles que não sobrescrevem essa chave (dev/test); application-prod.yml
  # já sobrescreve para contato@servirea.com.br (decidido com o usuário em
  # 22/09/2026) — ver javadoc de ResendProperties.

  # Rate limit do formulário público de inscrição (Fase 8, seção 45) — um
  # limitador em memória, por IP, de janela deslizante. Deliberadamente NÃO
  # usa Bucket4j/Redis (seção 45 só lista Bucket4j como UMA opção possível,
  # e desaconselha introduzir Redis) — funciona só para uma única instância
  # da aplicação; ver ressalva no README/plano mestre.
  rate-limit:
    inscricao-publica:
      max-tentativas: 5
      janela: PT1H

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      # Padrão conservador: não expor detalhe de componentes (ex.: se o
      # banco está de pé) sem autenticação. Ainda não existe Spring
      # Security nesta fase (chega na Fase 5, seção 105) — por isso o
      # padrão fica fechado, e só o profile "dev" abre (ver
      # application-dev.yml). Reavaliar quando a autenticação existir.
      show-details: never
  info:
    env:
      enabled: true

info:
  app:
    name: Servire API
    description: API multi-tenant de gestão paroquial (Servire)
