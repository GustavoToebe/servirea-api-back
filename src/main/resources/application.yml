spring:
  application:
    name: servire-api

  # Virtual Threads (seção 15/68 do plano mestre) — a aplicação continua
  # síncrona (não há justificativa para WebFlux), só o pool de threads do
  # Tomcat passa a usar Virtual Threads.
  threads:
    virtual:
      enabled: true

  jpa:
    # O Flyway é o dono do schema (migrations em db/migration). O Hibernate
    # nunca cria/altera tabela sozinho — só valida que as entidades batem
    # com o schema já migrado. Ver seção 8 do plano mestre ("Proibido
    # alterar produção manualmente e deixar a alteração fora do repositório").
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: false

# Autenticação própria (Fase 5, seção 32/105). "jwt.secret" propositalmente
# NÃO tem valor padrão aqui — só em application-dev.yml/application-test.yml
# (segredo fixo, só para desenvolvimento/teste) e via variável de ambiente
# JWT_SECRET em produção (application-prod.yml, sem valor padrão, mesma
# regra já usada para DB_URL/DB_USER/DB_PASSWORD — seção 90).
servire:
  security:
    jwt:
      access-token-ttl: PT15M
      tenant-selection-token-ttl: PT5M
    refresh-token-ttl: P30D
    password-reset-token-ttl: PT1H
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  # URL do Angular, usada só para montar o link de "esqueci minha senha"
  # (seção 32). Domínio oficial (servirea.com.br, seção 131.8) ainda não
  # registrado — valor de dev/test em application-dev.yml/application-test.yml;
  # em produção vem de FRONTEND_BASE_URL sem valor padrão (application-prod.yml,
  # mesma regra de DB_URL/JWT_SECRET, seção 90).

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      # Padrão conservador: não expor detalhe de componentes (ex.: se o
      # banco está de pé) sem autenticação. Ainda não existe Spring
      # Security nesta fase (chega na Fase 5, seção 105) — por isso o
      # padrão fica fechado, e só o profile "dev" abre (ver
      # application-dev.yml). Reavaliar quando a autenticação existir.
      show-details: never
  info:
    env:
      enabled: true

info:
  app:
    name: Servire API
    description: API multi-tenant de gestão paroquial (Servire)
