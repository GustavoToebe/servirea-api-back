# Profile usado pelos testes de integração (AbstractIntegrationTest). A
# URL/usuário/senha do datasource são sobrescritos em tempo de execução via
# @DynamicPropertySource, apontando para o container Testcontainers — os
# valores abaixo são só um fallback caso algum teste rode sem o container.
spring:
  jpa:
    hibernate:
      ddl-auto: validate

management:
  endpoint:
    health:
      show-details: always

# Segredo de JWT fixo só para os testes (nunca usar em dev/produção de
# verdade) — precisa decodificar para pelo menos 32 bytes (JwtService
# valida isso na inicialização).
servire:
  security:
    jwt:
      secret: dGVzdGUtc2VydmlyZS1qd3Qtc2VjcmV0LTMyLWJ5dGVzIQ==
    cors:
      allowed-origins: http://localhost:4200
  frontend:
    base-url: http://localhost:4200

logging:
  level:
    br.com.servire: DEBUG
    org.testcontainers: INFO
