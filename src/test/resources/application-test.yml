# Profile usado pelos testes de integração (AbstractIntegrationTest). A
# URL/usuário/senha do datasource são sobrescritos em tempo de execução via
# @DynamicPropertySource, apontando para o container Testcontainers — os
# valores abaixo são só um fallback caso algum teste rode sem o container.
spring:
  # Contextos de teste têm pools próprios e compartilham o PostgreSQL singleton.
  # Manter folga para concorrência sem esgotar max_connections ao ampliar a suíte.
  datasource:
    hikari:
      maximum-pool-size: 4
      minimum-idle: 1
  jpa:
    hibernate:
      ddl-auto: validate

management:
  endpoint:
    health:
      show-details: always

# Segredo de JWT fixo só para os testes (nunca usar em dev/produção de
# verdade) — precisa decodificar para pelo menos 32 bytes (JwtService
# valida isso na inicialização).
servire:
  security:
    jwt:
      secret: dGVzdGUtc2VydmlyZS1qd3Qtc2VjcmV0LTMyLWJ5dGVzIQ==
    cors:
      allowed-origins: http://localhost:4200
  frontend:
    base-url: http://localhost:4200
  # Storage/Turnstile (Fases 7/8): vazios nos testes — nenhum teste
  # automatizado desta rodada exercita upload real nem validação real do
  # Turnstile (seção "próximos passos" do README/plano mestre: testes
  # ficaram deliberadamente para depois).
  storage:
    base-url: ""
    service-role-key: ""
  turnstile:
    secret-key: ""
  # E-mail (Fase 11): fixo em "log" nos testes — nenhum teste automatizado
  # desta rodada deve chamar a API real do Resend (mesma regra de
  # Storage/Turnstile acima). Diferente de dev, aqui NÃO é
  # "${EMAIL_PROVIDER:log}" — é um valor fixo, para uma variável de
  # ambiente exportada por engano na máquina de quem roda os testes nunca
  # poder trocar isso.
  email:
    provider: log
  # WhatsApp dos comunicados: fixo em "log" e sem espera entre mensagens.
  segredos:
    chaves: v1:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
    chave-ativa: v1
  whatsapp:
    provider: log
    intervalo-min-ms: 0
    intervalo-max-ms: 0
  comunicado:
    fila-ativa: false
    pausa-email-ms: 0
    retentativa-ms: 0
  # Integração com a Central: chave de teste = segredo dos vetores do
  # contrato (docs da Central, seção 2.5), em Base64. Sem central-url, o
  # job de sincronização não faz nada.
  integracao:
    chaves-entrada: teste-central:c2VncmVkby1kZS10ZXN0ZS1uYW8tdXNhci1lbS1wcm9kdWNhby0wMTIzNDU2Nzg5

logging:
  level:
    br.com.servire: DEBUG
    org.testcontainers: INFO
